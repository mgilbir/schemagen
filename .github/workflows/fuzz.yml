name: Fuzz

# Nightly only, plus a manual button. Deliberately not wired to `push` or
# `pull_request`: a fuzz run costs its whole -fuzztime budget every time and
# almost always finds nothing, so on a PR it would add half an hour of latency
# for no signal. Regressions are handled the other way round -- a crasher the
# fuzzer writes into tests/testdata/fuzz/FuzzGenerate/ gets committed and from
# then on replays as an ordinary test case in the CI workflow's `go test ./...`.
# This job does the searching; CI does the remembering.
on:
  schedule:
    # 03:17 UTC. Off the hour on purpose -- Actions defers cron jobs that pile
    # up on popular round times.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: 'How long to fuzz for (go -fuzztime syntax, e.g. 10m, 2h)'
        required: false
        default: '30m'

permissions:
  contents: read

# Unlike CI, do NOT cancel a run in progress. Cancelling here throws away the
# accumulated corpus and search budget, and could kill the job in the middle of
# minimizing a crasher it has already found -- exactly the run worth keeping.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # -fuzztime bounds the search itself, but crash minimization runs after the
    # budget is spent and is not covered by it. Leave generous headroom over
    # the longest fuzz_time anyone is likely to dispatch so the job is never
    # killed mid-minimization; this is a backstop against a hang, not a budget.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The fuzz target is parse -> generate -> emit and never compiles the code
      # it produces, so the ECMA-262 reason ci.yml gives for this step does not
      # apply here. It is kept anyway for a different reason: it separates "the
      # module cache could not be populated" from "the fuzzer failed". Without
      # it a network blip surfaces as a red fuzz step with an empty artifact,
      # which reads exactly like a finding that got lost.
      - name: download dependencies
        run: go mod download

      # On a scheduled run `inputs.fuzz_time` is empty, so the 30m default here
      # is what nightly actually uses; the workflow_dispatch default only
      # applies to the manual form.
      - name: fuzz
        run: make fuzz FUZZTIME="${{ inputs.fuzz_time || '30m' }}"

      # always(), not the implicit success-only default and not failure():
      # a crash is precisely the case where the previous step is red, and
      # without an `if:` this step would be skipped exactly then -- the runner
      # is destroyed and the only copy of the reproducer goes with it.
      # always() additionally covers cancellation and the timeout-minutes kill,
      # where a crasher may already have been written to disk.
      #
      # go test writes failing inputs to tests/testdata/fuzz/<FuzzName>/ (the
      # generated non-failing corpus lives in the build cache and is not worth
      # keeping). Nothing is committed there -- seeds live as readable .json
      # under testdata/schemas/adversarial, which FuzzGenerate walks -- so on a
      # clean run the directory does not exist at all and if-no-files-found:
      # ignore keeps the job quiet. Anything uploaded here is therefore a real
      # find. Treat it as a starting point rather than the reproducer: when a
      # crash kills the minimizer, go saves the last input *sent*, which is
      # often truncated and does not reproduce on its own.
      #
      # It is a close starting point, though, and the way to use it is worth
      # writing down because reading it as junk costs an investigation.
      # workerClient.minimize, on an unrecoverable error with the raw value
      # still in shared memory, writes back the bytes the worker was executing
      # when it died -- so the file is the crasher with a chunk of it removed by
      # the minimizer, not something unrelated. For this target that usually
      # means JSON the minimizer truncated, which json.Unmarshal now refuses
      # before the generator is reached, which is exactly why replaying it
      # passes. Repair the JSON first -- close the braces, drop a dangling quote
      # -- and try the repaired document under each of fuzzSeedCfgBits before
      # concluding anything. That found the defect behind the 2026-08-22 run on
      # the first attempt.
      #
      # Nothing here can recover the worker's own output: internal/fuzz leaves
      # cmd.Stdout and cmd.Stderr nil on the worker process (a "TODO: record and
      # return stderr" that has outlived several releases), so its "fatal error"
      # line and stack go to /dev/null and no flag or GODEBUG brings them back.
      # The coordinator's wording is the only signal about *where* it died, and
      # it does distinguish two cases: "hung or terminated unexpectedly: exit
      # status 2" is a worker that died holding an input, which is where a seed
      # too slow for the ten-second deadline lands (issue #233, and what
      # TestFuzzSeedCorpusFitsTheWorkerDeadline now catches first); "... while
      # minimizing" is a worker that died after a finding had already been made,
      # so the artifact is that finding, one minimization step in.
      - name: upload crashers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: tests/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 90
