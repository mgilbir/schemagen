name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Two Go versions, because the code this project produces is compiled by
    # its caller with the caller's Go, and the two ends of what that can be are
    # not interchangeable. The go.mod minimum is what the module promises to
    # build with. Current stable is what a contributor installs today -- and
    # from Go 1.27 its encoding/json is backed by encoding/json/v2, which
    # accepts struct tags the original rejects. Before this matrix CI built
    # with the minimum alone, and `go test ./...` on a clean checkout was red
    # on stable for months without CI noticing (138 failures in the tag
    # grammar test). The tag tests ask both encoding/json implementations on
    # every toolchain now; this is what runs everything else under both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go.mod minimum
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}
          cache: true

      # gofmt exits 0 even when it has complaints, so fail on non-empty output.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      # Several tests build and run a throwaway module that imports the ECMA-262
      # regexp package, and x/net/idna for the two hostname formats. Those
      # dependencies are only reachable from generated code, so `go build ./...`
      # never fetches them and the first such test would do the download itself.
      # They are named in go.mod for exactly this reason -- nothing in this
      # repository imports them -- so a bare `go mod download` still pulls them.
      # A network problem then fails here, plainly, instead of inside a test.
      - name: download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The suite is checked out, at the pinned JSTS_COMMIT, for its fuzz
      # seeds: FuzzGenerate takes every test group's schema as a seed when the
      # suite is present, so without it this job replayed a fifth of the corpus
      # that a developer with the suite replays and that the nightly fuzz job
      # searches from -- three runs of one test, three corpora, and nothing
      # saying so. FuzzGenerate logs the provenance of its seeds and any
      # difference from this job's.
      - name: download test suite
        run: make download-test-suite

      # The JSON Schema Test Suite conformance run itself is gated behind
      # SCHEMAGEN_RUN_EXTERNAL and is not part of this job: it takes ~25
      # minutes. external.yml runs it nightly under both Go versions; run it
      # locally with `make test-external` before merging generator or emitter
      # changes.
      #
      # Goldens are compared here, never rewritten: the golden tests refuse
      # UPDATE_GOLDEN when GITHUB_ACTIONS is set, so a job that regenerated its
      # goldens before comparing them cannot pass.
      #
      # Under go test's default ten-minute timeout per test binary, on purpose.
      # The tests under tests/ were one package whose binary reached that limit
      # on this runner -- killed at 600s mid-run while every other package
      # finished in under 95s -- and the answer was to split it into packages
      # go test runs side by side, not to raise the limit: a timeout is what
      # turns a run that has quietly doubled into a failure somebody reads. The
      # per-package budget, and what to do when a package approaches it, is in
      # the README's Development section.
      - name: test
        run: go test ./... -count=1

      # A short cogen sweep, not the search. The nightly job in cogen.yml is the
      # search, and explains why a meaningful run is too slow for this one. What
      # this catches is different: the harness going invalid.
      #
      # It has happened. The additionalPropertiesSchema mutant asserted its
      # rejection names "additionalProperties"; #280 established that printing a
      # schema keyword where a document member goes is a defect, #283 removed it,
      # and the expectation was left pinning the old text. Every iteration then
      # failed for the same reason, on main, through four merges -- because
      # nothing on this path ran cogen at all.
      #
      # The budget is measured, not guessed: with that expectation planted back,
      # 8 and 20 iterations at seed 1 both pass and 40 fails. 50 is 40 plus
      # margin, and costs ~25s. A defect the search finds still belongs in a
      # fixture, exactly as before -- this only proves the harness still runs.
      - name: cogen smoke
        run: make cogen COGEN_SEED=1 COGEN_ITERS=50

  # The field-alignment check, in its own job because it takes about three
  # minutes and has nothing to say about anything the job above tests.
  #
  # `go test ./...` already runs TestGeneratedCorpusIsFieldAligned, which
  # measures every struct *declaration* the corpus produces. This runs the
  # fieldalignment analyzer itself, over every generator configuration that
  # changes the shape of a type (see scripts/lint-alignment.sh), and the
  # difference is the struct types declared inside a function body: the emitted
  # MarshalJSON and UnmarshalJSON each build one, reflect cannot name one, and
  # six of them were misordered when the layout pass first landed. Nothing but
  # the analyzer could see it.
  alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The analyzer is a build of another module and is fetched rather than
      # vendored, so this job needs the proxy. Generated code reaches the same
      # two dependencies the test job names.
      - name: download dependencies
        run: go mod download

      - name: fieldalignment
        run: make lint-alignment

  # The full determinism sweep, in its own job for the same reason as the
  # alignment check: it takes minutes and says nothing about what the test job
  # tests. `go test ./...` already holds the corpus to "same input, same output"
  # in one process and runs the binary over the scenarios written to drive each
  # known site. This adds the schema of every JSON Schema Test Suite group, and
  # every corpus schema run through the binary as separate processes, with more
  # runs each -- Go iterates a small map in one of only as many orders as it has
  # members, so what the extra runs buy is the site only a two- or three-member
  # map in some schema reaches.
  #
  # Under both Go versions, as the check job is: the generated code the sweep
  # type-checks is compiled by the caller's Go, and the order a map yields is
  # the runtime's, so a site either toolchain could expose is one to catch.
  determinism:
    name: determinism (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go.mod minimum
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}
          cache: true

      # The generated code the sweep type-checks imports the same two
      # dependencies the test job names; the suite is cloned at its pinned
      # commit by the target itself.
      - name: download dependencies
        run: go mod download

      - name: determinism
        run: make test-determinism
